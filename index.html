<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ofertas de Mercado Libre</title>
<style>
  :root { --paper:#FBF7EF; --ink:#1E1B16; --muted:#7A7167; --line:#E7DED0; --tomato:#E4572E; --green:#2D6A4F; --card:#fff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family: system-ui, sans-serif; font-size:16px; line-height:1.5; }
  .wrap { max-width:1100px; margin:0 auto; padding:0 16px; }
  header { padding:24px 0 10px; }
  h1 { font-family: Georgia, serif; font-weight:800; font-size:clamp(1.9rem,6vw,2.8rem); margin:0 0 6px; letter-spacing:-0.02em; }
  .lead { color:var(--muted); margin:0 0 14px; max-width:44ch; }
  .banner { background:var(--ink); color:var(--paper); padding:10px 14px; border-radius:10px; font-size:0.92rem; margin-bottom:12px; }
  .search { width:100%; font:inherit; padding:12px 14px; border:1.5px solid var(--line); border-radius:999px; background:var(--card); }
  .chips { display:flex; gap:8px; overflow-x:auto; padding:14px 0 6px; scrollbar-width:none; }
  .chip { flex:0 0 auto; font:inherit; font-size:0.92rem; padding:8px 14px; border-radius:999px; border:1.5px solid var(--ink); background:transparent; color:var(--ink); cursor:pointer; }
  .chip[aria-pressed="true"] { background:var(--ink); color:var(--paper); }
  .status { color:var(--muted); font-size:0.9rem; margin:6px 0 12px; min-height:1.2em; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  @media (min-width:720px) { .grid { grid-template-columns:repeat(3,1fr); gap:18px; } }
  @media (min-width:1000px) { .grid { grid-template-columns:repeat(4,1fr); } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; position:relative; }
  .thumb { aspect-ratio:1/1; background:#F3EEE4; display:grid; place-items:center; overflow:hidden; }
  .thumb img { width:100%; height:100%; object-fit:contain; }
  .noimg { font-family:Georgia,serif; font-weight:800; font-size:4rem; color:var(--line); }
  .stamp { position:absolute; top:10px; left:10px; background:var(--tomato); color:#fff; font-weight:600; font-size:0.85rem; padding:4px 9px; border-radius:6px; transform:rotate(-4deg); }
  .body { padding:12px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .name { font-size:0.92rem; margin:0; font-weight:600; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .desc { font-size:0.82rem; color:var(--muted); margin:0; }
  .desc.collapsed { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .more { background:none; border:0; padding:0; color:var(--tomato); font:inherit; font-size:0.82rem; font-weight:600; cursor:pointer; text-align:left; }
  .old { color:var(--muted); text-decoration:line-through; font-size:0.85rem; }
  .now { font-family:Georgia,serif; font-weight:800; font-size:1.35rem; line-height:1.1; }
  .coupon { font-size:0.82rem; color:var(--green); font-weight:600; }
  .buy { margin-top:auto; display:block; text-align:center; text-decoration:none; background:var(--ink); color:var(--paper); padding:11px; border-radius:10px; font-weight:600; font-size:0.95rem; }
  .buy:hover { background:var(--tomato); }
  .empty { grid-column:1/-1; padding:40px 10px; text-align:center; color:var(--muted); }
  section.block { margin:36px 0 0; padding-top:24px; border-top:1px solid var(--line); }
  h2 { font-size:1.25rem; margin:0 0 10px; font-family:Georgia,serif; }
  form.box { display:grid; gap:8px; max-width:520px; }
  input, textarea, select { font:inherit; padding:10px 12px; border:1.5px solid var(--line); border-radius:10px; background:#fff; width:100%; }
  textarea { min-height:90px; resize:vertical; }
  .btn { font:inherit; padding:11px 14px; border:0; border-radius:10px; background:var(--ink); color:var(--paper); cursor:pointer; font-weight:600; }
  .review { border-bottom:1px solid var(--line); padding:12px 0; }
  .stars { color:var(--tomato); letter-spacing:2px; }
  .reply { background:#F3EEE4; padding:8px 10px; border-radius:8px; margin-top:6px; font-size:0.92rem; }
  .muted { color:var(--muted); font-size:0.9rem; }
  footer { border-top:1px solid var(--line); margin-top:40px; padding:20px 0 40px; color:var(--muted); font-size:0.85rem; }
  footer a { color:var(--ink); margin-right:12px; cursor:pointer; text-decoration:underline; }
  #pie { font-size:0.8rem; color:var(--muted); line-height:1.6; white-space:pre-line; max-width:70ch; margin:0 0 14px; }
  dialog { border:0; border-radius:14px; max-width:560px; width:calc(100% - 32px); padding:20px; background:var(--card); }
  dialog::backdrop { background:rgba(0,0,0,0.4); }
  dialog h3 { margin-top:0; font-family:Georgia,serif; }
  dialog pre { white-space:pre-wrap; font-family:inherit; font-size:0.92rem; }
  .toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 16px; border-radius:8px; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90%; text-align:center; }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="titulo">Ofertas del día</h1>
    <p class="lead" id="subtitulo"></p>
    <div class="banner" id="banner" style="display:none"></div>
    <input class="search" id="q" type="search" placeholder="Buscar producto" aria-label="Buscar producto">
  </header>

  <nav class="chips" id="chips" aria-label="Categorías"></nav>
  <p class="status" id="status" role="status">Cargando ofertas…</p>
  <section class="grid" id="grid" aria-live="polite"></section>

  <section class="block" id="valoraciones">
    <h2>Opiniones de clientes</h2>
    <div id="listaValoraciones"></div>
    <h2 style="margin-top:24px">Dejá tu opinión</h2>
    <form class="box" id="formValoracion">
      <input id="vNombre" placeholder="Tu nombre" maxlength="80" required>
      <select id="vEstrellas" required>
        <option value="5">★★★★★</option><option value="4">★★★★</option><option value="3">★★★</option><option value="2">★★</option><option value="1">★</option>
      </select>
      <textarea id="vTexto" placeholder="Contá tu experiencia" maxlength="1000" required></textarea>
      <button class="btn" type="submit">Enviar opinión</button>
      <span class="muted">Las opiniones se publican después de revisarlas.</span>
    </form>
  </section>

  <section class="block" id="contacto">
    <h2>Escribinos</h2>
    <form class="box" id="formMensaje">
      <input id="mNombre" placeholder="Tu nombre" maxlength="80" required>
      <input id="mEmail" type="email" placeholder="Tu email" maxlength="120" required>
      <textarea id="mTexto" placeholder="Tu mensaje (solo lo lee el administrador)" maxlength="2000" required></textarea>
      <button class="btn" type="submit">Enviar mensaje</button>
    </form>
    <div id="respuestas" style="margin-top:14px"></div>
  </section>

  <footer>
    <p id="pie"></p>
    <a data-doc="privacidad">Privacidad</a>
    <a data-doc="ml">Programa de afiliados de Mercado Libre</a>
    <a data-doc="condiciones">Condiciones</a>
  </footer>
</div>

<dialog id="dlg">
  <h3 id="dlgTitulo"></h3>
  <pre id="dlgTexto"></pre>
  <button class="btn" onclick="this.closest('dialog').close()">Cerrar</button>
</dialog>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = "https://fsrzngbwdcraapenfpdn.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZzcnpuZ2J3ZGNyYWFwZW5mcGRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1ODQ1NzUsImV4cCI6MjEwNzE2MDU3NX0.kHzfiUvYNVTSVpIWdSOj1cvHA5sj5OLTrQwCKDvmStE";

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const state = { products: [], settings: {}, reviews: [], cat: "Todas", q: "" };
  const DESC_CORTA = 90;
  const fmt = n => "$ " + Number(n).toLocaleString("es-AR");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  function toast(msg) {
    const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200);
  }

  function vigente(p) {
    return !p.vence || new Date(p.vence + "T23:59:59") >= new Date();
  }
  function offOf(p) {
    return p.anterior && p.anterior > p.precio ? Math.round((1 - p.precio / p.anterior) * 100) : 0;
  }

  function estiloImagen(p) {
    const ajuste = p.imagen_ajuste === "cover" ? "cover" : "contain";
    const tx = ((p.imagen_pos_x ?? 50) - 50) * 2;
    const ty = ((p.imagen_pos_y ?? 50) - 50) * 2;
    const zoom = p.imagen_zoom || 1;
    return `object-fit:${ajuste};transform:translate(${tx}%, ${ty}%) scale(${zoom})`;
  }

  async function cargarTodo() {
    const status = document.getElementById("status");
    try {
      const [prod, sett, rev] = await Promise.all([
        sb.from("products").select("*").eq("activo", true),
        sb.from("settings").select("*"),
        sb.from("reviews").select("*").eq("aprobada", true).order("created_at", { ascending: false })
      ]);
      if (prod.error) throw prod.error;
      if (sett.error) throw sett.error;
      if (rev.error) throw rev.error;
      state.products = prod.data;
      state.settings = Object.fromEntries(sett.data.map(r => [r.key, r.value]));
      state.reviews = rev.data;
      renderTextos();
      renderChips();
      renderGrid();
      renderValoraciones();
      renderRespuestas();
    } catch (err) {
      status.textContent = "No se pudieron cargar las ofertas. Probá de nuevo en un rato.";
      console.error(err);
    }
  }

  // Importante: hay que esperar (await) la llamada, si no Supabase no la envía
  async function contarVisita() {
    if (sessionStorage.getItem("visitado")) return;
    sessionStorage.setItem("visitado", "1");
    await sb.rpc("registrar_visita");
  }

  function renderTextos() {
    const s = state.settings;
    if (s.titulo) { document.getElementById("titulo").textContent = s.titulo; document.title = s.titulo; }
    if (s.subtitulo) document.getElementById("subtitulo").textContent = s.subtitulo;
    const b = document.getElementById("banner");
    if (s.banner) { b.textContent = s.banner; b.style.display = "block"; }
    if (s.footer) document.getElementById("pie").textContent = s.footer;
  }

  function visibles() {
    return state.products.filter(vigente);
  }

  function renderChips() {
    const cats = ["Todas", ...new Set(visibles().map(p => p.categoria))];
    document.getElementById("chips").innerHTML = cats.map(c =>
      `<button class="chip" type="button" aria-pressed="${c === state.cat}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
  }

  function renderGrid() {
    const q = state.q.toLowerCase();
    const list = visibles()
      .filter(p => state.cat === "Todas" || p.categoria === state.cat)
      .filter(p => !q || p.nombre.toLowerCase().includes(q))
      .sort((a, b) => offOf(b) - offOf(a));
    document.getElementById("status").textContent = list.length ? `${list.length} ofertas` : "";
    document.getElementById("grid").innerHTML = list.length ? list.map(p => {
      const off = offOf(p);
      const largo = p.descripcion && p.descripcion.length > DESC_CORTA;
      return `
      <article class="card">
        <div class="thumb">
          ${p.imagen ? `<img src="${esc(p.imagen)}" alt="${esc(p.nombre)}" loading="lazy" style="${estiloImagen(p)}">` : `<span class="noimg" aria-hidden="true">${esc(p.nombre.charAt(0))}</span>`}
          ${off ? `<span class="stamp">−${off}%</span>` : ""}
        </div>
        <div class="body">
          <h3 class="name">${esc(p.nombre)}</h3>
          ${p.descripcion ? `<p class="desc ${largo ? "collapsed" : ""}" id="d-${p.id}">${esc(p.descripcion)}</p>` : ""}
          ${largo ? `<button class="more" type="button" data-more="${p.id}">Ver más</button>` : ""}
          ${p.anterior && p.anterior > p.precio ? `<span class="old">${fmt(p.anterior)}</span>` : ""}
          <span class="now">${fmt(p.precio)}</span>
          ${p.cupon ? `<span class="coupon">Cupón: ${esc(p.cupon)}</span>` : ""}
          <a class="buy" href="${esc(p.link)}" target="_blank" rel="noopener sponsored" data-id="${p.id}">Ver en Mercado Libre</a>
        </div>
      </article>`;
    }).join("") : `<p class="empty">No hay ofertas para esta búsqueda.</p>`;
  }

  function renderValoraciones() {
    document.getElementById("listaValoraciones").innerHTML = state.reviews.map(r => `
      <div class="review">
        <strong>${esc(r.nombre)}</strong> <span class="stars">${"★".repeat(r.estrellas)}</span>
        <div>${esc(r.texto)}</div>
      </div>`).join("") || `<p class="muted">Todavía no hay opiniones publicadas. ¡Sé el primero!</p>`;
  }

  async function renderRespuestas() {
    const ids = JSON.parse(localStorage.getItem("mis_mensajes") || "[]");
    if (!ids.length) return;
    const { data, error } = await sb.rpc("respuestas_de", { p_ids: ids });
    if (error) return;
    document.getElementById("respuestas").innerHTML = data.map(m => `
      <div class="review"><div class="muted">Tu mensaje: ${esc(m.texto)}</div>
      <div class="reply"><strong>Respuesta:</strong> ${esc(m.respuesta)}</div></div>`).join("");
  }

  document.getElementById("chips").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    state.cat = b.dataset.cat; renderChips(); renderGrid();
  });
  document.getElementById("q").addEventListener("input", e => {
    state.q = e.target.value.trim(); renderGrid();
  });
  document.getElementById("grid").addEventListener("click", async e => {
    const m = e.target.closest(".more");
    if (m) {
      const d = document.getElementById("d-" + m.dataset.more);
      const abierto = d.classList.toggle("collapsed") === false;
      m.textContent = abierto ? "Ver menos" : "Ver más";
      return;
    }
    const a = e.target.closest(".buy"); if (!a) return;
    await sb.rpc("registrar_clic", { p_id: a.dataset.id });
  });

  document.getElementById("formValoracion").addEventListener("submit", async e => {
    e.preventDefault();
    const { error } = await sb.from("reviews").insert({
      nombre: vNombre.value.trim(),
      estrellas: Number(vEstrellas.value),
      texto: vTexto.value.trim(),
      aprobada: false
    });
    if (error) return toast("No se pudo enviar. Probá de nuevo.");
    e.target.reset();
    toast("¡Gracias! Tu opinión queda pendiente de revisión.");
  });

  document.getElementById("formMensaje").addEventListener("submit", async e => {
    e.preventDefault();
    const id = crypto.randomUUID();
    const { error } = await sb.from("messages").insert({
      id,
      nombre: mNombre.value.trim(),
      email: mEmail.value.trim(),
      texto: mTexto.value.trim(),
      respuesta: ""
    });
    if (error) return toast("No se pudo enviar. Probá de nuevo.");
    const ids = JSON.parse(localStorage.getItem("mis_mensajes") || "[]");
    ids.push(id);
    localStorage.setItem("mis_mensajes", JSON.stringify(ids));
    e.target.reset();
    toast("Mensaje enviado");
  });

  document.querySelectorAll("footer a[data-doc]").forEach(a => a.addEventListener("click", () => {
    const k = a.dataset.doc;
    const titulos = { privacidad: "Política de privacidad", ml: "Programa de afiliados de Mercado Libre", condiciones: "Condiciones de uso" };
    const claves = { privacidad: "privacidad", ml: "ml", condiciones: "condiciones" };
    document.getElementById("dlgTitulo").textContent = titulos[k];
    document.getElementById("dlgTexto").textContent = state.settings[claves[k]] || "";
    document.getElementById("dlg").showModal();
  }));

  contarVisita();
  cargarTodo();
</script>
</body>
</html>
